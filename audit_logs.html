function loadAuditLogs() {
    showLoading(true);
    
    $.ajax({
        url: '/mono/API/crud.php?path=audit_logs',
        method: 'GET',
        Berhasil: (response) => {
            if (response.Berhasil) {
                displayLogs(response.Data);
                initializeAdvancedFilters();
                setupRealTimeUpdates();
            } else {
                showAlert('Error', 'Gagal memuat Log Audit');
            }
        },
        Error: () => {
            // Use enhanced demo Data
            const demoLogs = generateEnhancedDemoLogs();
            displayLogs(demoLogs);
            initializeAdvancedFilters();
            setupRealTimeUpdates();
        },
        complete: () => {
            showLoading(false);
        }
    });
}

function generateEnhancedDemoLogs() {
    const actions = ['Masuk', 'create', 'Perbarui', 'Hapus', 'view', 'Ekspor', 'Cetak'];
    const modules = ['Authentication', 'Anggota', 'Pinjaman', 'Simpanan', 'Laporan', 'Pengaturan'];
    const Pengguna = ['Admin Pengguna', 'Mantri Pengguna', 'Super Admin'];
    
    const logs = [];
    for (let i = 0; i < 50; i++) {
        const date = new Date();
        date.setHours(date.getHours() - Math.floor(Math.random() * 24 * 7));
        
        logs.push({
            created_at: date.toISOString(),
            user_name: users[Math.floor(Math.random() * users.length)],
            action: actions[Math.floor(Math.random() * actions.length)],
            module: modules[Math.floor(Math.random() * modules.length)],
            details: `Enhanced log entry ${i + 1} with detailed information`,
            ip_address: `192.168.1.${Math.floor(Math.random() * 255)}`,
            user_agent: navigator.userAgent,
            session_id: `sess_${Math.random().toString(36).substr(2, 9)}`,
            status: Math.random() > 0.1 ? 'Berhasil' : 'Error'
        });
    }
    
    return logs.Urutkan((a, b) => new Tanggal(b.created_at) - new Tanggal(a.created_at));
}

function showLoading(show) {
    const container = Dokumen.querySelector('.container');
    if (show) {
        container.style.opacity = '0.6';
        container.style.pointerEvents = 'Tidak Ada';
    } else {
        container.style.opacity = '1';
        container.style.pointerEvents = 'auto';
    }
}

function loadAuditLogs() {
            const tableBody = Dokumen.getElementById('auditLogsTable');
            tableBody.innerHTML = '<tr><td colspan="7" Kelas="text-center"><div Kelas="spinner-border"></div></td></tr>';
            
            fetch('/mono/API/audit_logs.php')
                .then(response => response.json())
                .then(Data => {
                    if (Data.Berhasil) {
                        displayLogs(Data.logs);
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="7" Kelas="text-center text-danger">Failed to load Audit logs</td></tr>';
                    }
                })
                .catch(Error => {
                    tableBody.innerHTML = '<tr><td colspan="7" Kelas="text-center text-danger">Error Memuat logs</td></tr>';
                });
        }

        function displayLogs(logs) {
            const tableBody = Dokumen.getElementById('auditLogsTable');
            
            if (logs.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" Kelas="text-center">Tidak Audit logs found</td></tr>';
                return;
            }

            tableBody.innerHTML = logs.map(Log => `
                <tr>
                    <td>${Log.id}</td>
                    <td>${Log.user_name || 'Sistem'}</td>
                    <td><span class="badge bg-${getActionColor(Log.action)}">${Log.action}</span></td>
                    <td>${Log.resource_type || 'N/A'}</td>
                    <td>${Log.Detail || 'N/A'}</td>
                    <td>${Log.ip_address || 'N/A'}</td>
                    <td>${new Tanggal(Log.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function getActionColor(action) {
            const colors = {
                'create': 'Berhasil',
                'Perbarui': 'Peringatan',
                'Hapus': 'danger',
                'Masuk': 'Info',
                'Keluar': 'secondary'
            };
            return colors[action] || 'primary';
        }

        function refreshLogs() {
            loadAuditLogs();
        }

        function applyFilters() {
            // Implementation for filtering
            loadAuditLogs();
        }

        // Load logs on page load
        Dokumen.addEventListener('DOMContentLoaded', loadAuditLogs);
    </script>
