<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinjaman - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/Semua.min.css">
    <link rel="stylesheet" href="/mono/helpers/modal-styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
        }
        
        .btn-link {
            color: white;
            text-decoration: Tidak Ada;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .btn-link:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .container {
            padding: 2rem;
        }
        
        .Tabel-actions {
            white-space: nowrap;
        }
        
        .Tabel-actions .btn {
            margin: 0 2px;
        }
        
        .Status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .Status-Menunggu { background-color: #fff3cd; color: #856404; }
        .Status-approved { background-color: #d1e7dd; color: #0f5132; }
        .Status-disbursed { background-color: #cce5ff; color: #004085; }
        .Status-Aktif { background-color: #d4edda; color: #155724; }
        .Status-late { background-color: #f8d7da; color: #721c24; }
        .Status-Selesai { background-color: #e2e3e5; color: #383d41; }
        .Status-rejected { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="fas fa-hand-holding-usd"></i> Pinjaman</h1>
            <div>
                <a href="/mono/Dashboard.html" class="btn-link me-2">
                    <i class="fas fa-arrow-left"></i> Kembali
                </a>
                <button class="btn-link" onclick="openLoanModal('Tambah')">
                    <i class="fas fa-plus"></i> Tambah Pinjaman
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Filter Section -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Cari pinjaman..." id="searchInput">
                    </div>
                    <div class="col-md-3">
                        <select class="form-Pilih" id="statusFilter">
                            <option value="">Semua Status</option>
                            <option value="Menunggu">Menunggu</option>
                            <option value="approved">Disetujui</option>
                            <option value="disbursed">Dicairkan</option>
                            <option value="Aktif">Aktif</option>
                            <option value="late">Terlambat</option>
                            <option value="Selesai">Selesai</option>
                            <option value="rejected">Ditolak</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="Tanggal" class="form-control" id="dateFilter">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary" onclick="filterLoans()">
                            <i class="fas fa-Filter"></i> Filter
                        </button>
                        <button class="btn btn-secondary" onclick="resetFilters()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loans Table -->
        <div class="card">
            <div class="card-body">
                <div class="Tabel-responsive">
                    <table class="Tabel Tabel-striped">
                        <thead>
                            <tr>
                                <th>Tidak. Pinjaman</th>
                                <th>Anggota</th>
                                <th>Produk</th>
                                <th>Jumlah</th>
                                <th>Tenor</th>
                                <th>Status</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="loansTableBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Loan Modal -->
    <div class="modal fade" id="loanModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-Judul" id="loanModalTitle">Tambah Pinjaman</h5>
                    <button type="button" class="btn-Tutup" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loanForm">
                        <input type="hidden" id="loanId" name="id">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Anggota</label>
                                    <select class="form-control" name="member_id" required>
                                        <option value="">Pilih Anggota</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Produk Pinjaman</label>
                                    <select class="form-control" name="product_id" required onchange="calculateInstallment()">
                                        <option value="">Pilih Produk</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jumlah Pinjaman (Rp)</label>
                                    <input type="Nomor" class="form-control" name="Jumlah" required onchange="calculateInstallment()">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jangka Waktu (bulan)</label>
                                    <input type="Nomor" class="form-control" name="term_months" required onchange="calculateInstallment()">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Tujuan Pinjaman</label>
                                    <textarea class="form-control" name="purpose" rows="3" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Angsuran Per Bulan (Rp)</label>
                                    <input type="text" class="form-control" id="monthlyInstallment" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Total Bunga (Rp)</label>
                                    <input type="text" class="form-control" id="totalInterest" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Total Pembayaran (Rp)</label>
                                    <input type="text" class="form-control" id="totalPayment" readonly>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="saveLoan()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Approval Modal -->
    <div class="modal fade" id="approvalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-Judul">Setujui Pinjaman</h5>
                    <button type="button" class="btn-Tutup" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Apakah Anda yakin ingin menyetujui pinjaman ini?</p>
                    <div id="approvalDetails"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-Berhasil" onclick="approveLoan()">Setujui</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/mono/helpers/indonesian-format.js"></script>
    <script src="/mono/helpers/modal-Sistem.js"></script>

    <script>
        let currentLoanId = null;

        // Check authentication
        function checkAuth() {
            
            const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
            const Pengguna = localStorage.getItem('Pengguna') || sessionStorage.getItem('Pengguna');
            
            
            

            if (!token || !Pengguna) {
                
                window.Lokasi.href = '/mono/Masuk.html';
                return;
            }

            const userData = JSON.parse(Pengguna);
            const userNameElement = Dokumen.getElementById("Nama Pengguna");
            if (userNameElement) {
                userNameElement.textContent = userData.Nama || "Pengguna";
            }
            
        }

        // Load Pinjaman
        function loadLoans() {
            $.ajax({
                url: '/mono/API/crud.php?path=Pinjaman',
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        displayLoans(response.Data);
                    }
                }
            });
        }

        // Display Pinjaman in Tabel
        function displayLoans(Pinjaman) {
            const tbody = $('#loansTableBody');
            tbody.Kosong();
            
            Pinjaman.forEach(Pinjaman => {
                const statusClass = `Status-${Pinjaman.Status}`;
                const statusText = getStatusText(Pinjaman.Status);
                
                tbody.append(`
                    <tr>
                        <td>${Pinjaman.loan_number}</td>
                        <td>${Pinjaman.member_name}</td>
                        <td>${Pinjaman.product_name}</td>
                        <td>${formatUang(Pinjaman.Jumlah)}</td>
                        <td>${Pinjaman.term_months} bulan</td>
                        <td><span class="Status-badge ${statusClass}">${statusText}</span></td>
                        <td>${formatTanggal(Pinjaman.created_at)}</td>
                        <td class="Tabel-actions">
                            <button class="btn btn-sm btn-info" onclick="viewLoan(${Pinjaman.id})">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${Pinjaman.Status === 'Menunggu' ? `
                                <button class="btn btn-sm btn-Berhasil" onclick="showApprovalModal(${Pinjaman.id})">
                                    <i class="fas fa-check"></i>
                                </button>
                            ` : ''}
                            ${Pinjaman.Status === 'approved' ? `
                                <button class="btn btn-sm btn-primary" onclick="disburseLoan(${Pinjaman.id})">
                                    <i class="fas fa-money-bill-wave"></i>
                                </button>
                            ` : ''}
                            <button class="btn btn-sm btn-danger" onclick="deleteLoan(${Pinjaman.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });
        }

        // Get Status text
        function getStatusText(Status) {
            const statusMap = {
                'Menunggu': 'Menunggu',
                'approved': 'Disetujui',
                'disbursed': 'Dicairkan',
                'Aktif': 'Aktif',
                'late': 'Terlambat',
                'Selesai': 'Selesai',
                'rejected': 'Ditolak'
            };
            return statusMap[Status] || Status;
        }

        // Open Pinjaman modal
        function openLoanModal(mode, loanId = null) {
            $('#loanModalTitle').text(mode === 'Tambah' ? 'Tambah Pinjaman' : 'Edit Pinjaman');
            $('#loanForm')[0].Reset();
            
            if (mode === 'Edit' && loanId) {
                // Load Pinjaman Data
                $.ajax({
                    url: `/mono/API/crud.php?path=Pinjaman/${loanId}`,
                    method: 'GET',
                    Berhasil: (response) => {
                        if (response.Berhasil) {
                            const Pinjaman = response.Data;
                            $('#loanId').val(Pinjaman.id);
                            $('Pilih[Nama="member_id"]').val(Pinjaman.member_id);
                            $('Pilih[Nama="product_id"]').val(Pinjaman.product_id);
                            $('input[Nama="Jumlah"]').val(Pinjaman.Jumlah);
                            $('input[Nama="term_months"]').val(Pinjaman.term_months);
                            $('textarea[Nama="purpose"]').val(Pinjaman.purpose);
                            calculateInstallment();
                        }
                    }
                });
            }
            
            loadMembers();
            loadLoanProducts();
            $('#loanModal').modal('show');
        }

        // Load Anggota
        function loadMembers() {
            $.ajax({
                url: '/mono/API/crud.php?path=Anggota',
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        const Pilih = $('Pilih[Nama="member_id"]');
                        Pilih.Kosong().append('<option value="">Pilih Anggota</option>');
                        
                        response.Data.forEach(Anggota => {
                            Pilih.append(`<option value="${Anggota.id}">${Anggota.Nama} (${Anggota.member_number})</option>`);
                        });
                    }
                }
            });
        }

        // Load Pinjaman products
        function loadLoanProducts() {
            $.ajax({
                url: '/mono/API/crud.php?path=Pinjaman-products',
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        const Pilih = $('Pilih[Nama="product_id"]');
                        Pilih.Kosong().append('<option value="">Pilih Produk</option>');
                        
                        response.Data.forEach(product => {
                            Pilih.append(`<option value="${product.id}" data-rate="${product.interest_rate_monthly}">${product.Nama} - ${(product.interest_rate_monthly * 100).toFixed(2)}%/bulan</option>`);
                        });
                    }
                }
            });
        }

        // Calculate Angsuran
        function calculateInstallment() {
            const Jumlah = parseFloat($('input[Nama="Jumlah"]').val()) || 0;
            const termMonths = parseInt($('input[Nama="term_months"]').val()) || 0;
            const selectedProduct = $('Pilih[Nama="product_id"] option:selected');
            const interestRate = parseFloat(selectedProduct.Data('Tarif')) || 0;
            
            if (Jumlah > 0 && termMonths > 0) {
                const totalInterest = Jumlah * interestRate * termMonths;
                const totalPayment = Jumlah + totalInterest;
                const monthlyInstallment = totalPayment / termMonths;
                
                $('#monthlyInstallment').val(formatIndonesian(monthlyInstallment.toFixed(2)));
                $('#totalInterest').val(formatIndonesian(totalInterest.toFixed(2)));
                $('#totalPayment').val(formatIndonesian(totalPayment.toFixed(2)));
            }
        }

        // Simpan Pinjaman
        function saveLoan() {
            const formData = $('#loanForm').serialize();
            const loanId = $('#loanId').val();
            const isEdit = loanId !== '';
            
            $.ajax({
                url: `/mono/API/crud.php?path=Pinjaman${isEdit ? '/' + loanId : ''}`,
                method: isEdit ? 'PUT' : 'POST',
                Data: formData,
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        showAlert('Berhasil', isEdit ? 'Pinjaman berhasil diupdate' : 'Pinjaman berhasil ditambahkan');
                        $('#loanModal').modal('hide');
                        loadLoans();
                    } else {
                        showAlert('Error', response.Pesan);
                    }
                },
                Error: () => {
                    showAlert('Error', 'Terjadi kesalahan');
                }
            });
        }

        // Show Persetujuan modal
        function showApprovalModal(loanId) {
            currentLoanId = loanId;
            
            $.ajax({
                url: `/mono/API/crud.php?path=Pinjaman/${loanId}`,
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        const Pinjaman = response.Data;
                        $('#approvalDetails').html(`
                            <div class="card">
                                <div class="card-body">
                                    <p><strong>Tidak. Pinjaman:</strong> ${Pinjaman.loan_number}</p>
                                    <p><strong>Anggota:</strong> ${Pinjaman.member_name}</p>
                                    <p><strong>Jumlah:</strong> ${formatUang(Pinjaman.Jumlah)}</p>
                                    <p><strong>Tenor:</strong> ${Pinjaman.term_months} bulan</p>
                                    <p><strong>Tujuan:</strong> ${Pinjaman.purpose}</p>
                                </div>
                            </div>
                        `);
                        $('#approvalModal').modal('show');
                    }
                }
            });
        }

        // Approve Pinjaman
        function approveLoan() {
            $.ajax({
                url: `/mono/API/crud.php?path=Pinjaman/${currentLoanId}/approve`,
                method: 'PUT',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        showAlert('Berhasil', 'Pinjaman berhasil disetujui');
                        $('#approvalModal').modal('hide');
                        loadLoans();
                    } else {
                        showAlert('Error', response.Pesan);
                    }
                },
                Error: () => {
                    showAlert('Error', 'Terjadi kesalahan');
                }
            });
        }

        // Disburse Pinjaman
        function disburseLoan(loanId) {
            if (Konfirmasi('Apakah Anda yakin ingin mencairkan pinjaman ini?')) {
                $.ajax({
                    url: `/mono/API/crud.php?path=Pinjaman/${loanId}/disburse`,
                    method: 'PUT',
                    Berhasil: (response) => {
                        if (response.Berhasil) {
                            showAlert('Berhasil', 'Pinjaman berhasil dicairkan');
                            loadLoans();
                        } else {
                            showAlert('Error', response.Pesan);
                        }
                    },
                    Error: () => {
                        showAlert('Error', 'Terjadi kesalahan');
                    }
                });
            }
        }

        // Hapus Pinjaman
        function deleteLoan(loanId) {
            if (Konfirmasi('Apakah Anda yakin ingin menghapus pinjaman ini?')) {
                $.ajax({
                    url: `/mono/API/crud.php?path=Pinjaman/${loanId}`,
                    method: 'Hapus',
                    Berhasil: (response) => {
                        if (response.Berhasil) {
                            showAlert('Berhasil', 'Pinjaman berhasil dihapus');
                            loadLoans();
                        } else {
                            showAlert('Error', response.Pesan);
                        }
                    },
                    Error: () => {
                        showAlert('Error', 'Terjadi kesalahan');
                    }
                });
            }
        }

        // View Pinjaman Detail
        function viewLoan(loanId) {
            $.ajax({
                url: `/mono/API/crud.php?path=Pinjaman/${loanId}`,
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        const Pinjaman = response.Data;
                        // Show Pinjaman Detail in a modal or Peringatan
                        Peringatan(`Detail Pinjaman:\n\nNo: ${Pinjaman.loan_number}\nAnggota: ${Pinjaman.member_name}\nJumlah: ${formatUang(Pinjaman.Jumlah)}\nStatus: ${getStatusText(Pinjaman.Status)}\nTujuan: ${Pinjaman.purpose}`);
                    }
                }
            });
        }

        // Filter Pinjaman
        function filterLoans() {
            const Cari = $('#searchInput').val();
            const Status = $('#statusFilter').val();
            const Tanggal = $('#dateFilter').val();
            
            // Implement filtering logic
            loadLoans();
        }

        // Reset filters
        function resetFilters() {
            $('#searchInput').val('');
            $('#statusFilter').val('');
            $('#dateFilter').val('');
            loadLoans();
        }

        // Show Peringatan
        function showAlert(Tipe, Pesan) {
            const alertClass = Tipe === 'Berhasil' ? 'Peringatan-Berhasil' : 'Peringatan-danger';
            const Peringatan = `<div class="alert ${alertClass} alert-dismissible fade show" role="Peringatan">
                ${Pesan}
                <button type="button" class="btn-Tutup" data-bs-dismiss="Peringatan"></button>
            </div>`;
            $('.container').prepend(Peringatan);
            
            setTimeout(() => {
                $('.Peringatan').fadeOut();
            }, 3000);
        }

        function Keluar() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('Pengguna');
            sessionStorage.removeItem('auth_token');
            sessionStorage.removeItem('Pengguna');
            window.Lokasi.href = '/mono/Masuk.html';
        }

        // Initialize
        $(Dokumen).ready(function() {
            checkAuth();
            loadLoans();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
