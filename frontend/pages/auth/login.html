<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/Semua.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .Masuk-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: Tidak Ada;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: Tidak Ada;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .btn-purple {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            border: Tidak Ada;
        }

        .btn-orange {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            color: white;
            border: Tidak Ada;
        }

        .Peringatan {
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: Tidak Ada;
        }

        .Peringatan-Error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .Peringatan-Berhasil {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #666;
            font-size: 0.8rem;
        }

        .environment-badge {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="environment-badge">DEVELOPMENT MODE</div>

        <div class="logo">
            <h1>KSP Lam Gabe Jaya</h1>
            <p>Sistem Koperasi Single Cooperative</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="Email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" 
                           class="form-control" 
                           id="email" 
                           name="email" 
                           placeholder="Masukkan email"
                           required
                           aria-describedby="emailHelp"
                           autocomplete="email">
                </div>
                <div id="emailHelp" class="form-text text-muted">
                    Masukkan Email yang terdaftar
                </div>
            </div>

            <div class="form-Grup">
                <label for="Kata Sandi">Kata Sandi</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <!-- Development Credentials Display -->
        <div class="card mb-3">
            <div class="card-header bg-info text-white">
                <h6 class="mb-0">🔑 Quick Masuk - Pilih Role</h6>
            </div>
            <div class="card-body p-3">
                <div class="row" id="roleButtons">
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-primary btn-sm w-100" onclick="quickLogin('Admin@lamabejaya.coop', 'admin123')">
                            <i class="fas fa-user-tie"></i> Admin
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-dark btn-sm w-100" onclick="quickLogin('test_super_admin@lamabejaya.coop', 'password123')">
                            <i class="fas fa-user-shield"></i> Super Admin
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-alert btn-sm w-100" onclick="quickLogin('test_teller@lamabejaya.coop', 'password123')">
                            <i class="fas fa-cash-Daftar"></i> Teller
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-info btn-sm w-100" onclick="quickLogin('test_surveyor@lamabejaya.coop', 'password123')">
                            <i class="fas fa-Cari-Lokasi"></i> Surveyor
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-secondary btn-sm w-100" onclick="quickLogin('test_collector@lamabejaya.coop', 'password123')">
                            <i class="fas fa-hand-holding-usd"></i> Penagih
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-outline-primary btn-sm w-100" onclick="quickLogin('test_kasir@lamabejaya.coop', 'password123')">
                            <i class="fas fa-calculator"></i> Kasir
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-outline-Berhasil btn-sm w-100" onclick="quickLogin('test_mantri@lamabejaya.coop', 'password123')">
                            <i class="fas fa-user"></i> Mantri
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-outline-info btn-sm w-100" onclick="quickLogin('test_member@lamabejaya.coop', 'password123')">
                            <i class="fas fa-user"></i> Anggota
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-purple btn-sm w-100" onclick="quickLogin('test_manajer@lamabejaya.coop', 'password123')">
                            <i class="fas fa-user-tie"></i> Manajer
                        </button>
                    </div>
                    <div class="col-md-4 col-sm-6 mb-2">
                        <button class="btn btn-orange btn-sm w-100" onclick="quickLogin('test_akuntansi@lamabejaya.coop', 'password123')">
                            <i class="fas fa-calculator"></i> Akuntansi
                        </button>
                    </div>
                </div>
                <div class="mt-3">
                    <small class="text-muted">
                        <i class="fas fa-info-circle"></i> 
                        Click any role button for instant Masuk. Or use manual Formulir above.
                    </small>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 KSP Lam Gabe Jaya - Development Version</p>
        </div>
    </div>

    <script>
        Dokumen.getElementById('loginForm').addEventListener('Kirim', async function (e) {
            e.preventDefault();

            const Email = Dokumen.getElementById('Email').value;
            const Kata Sandi = Dokumen.getElementById('Kata Sandi').value;
            const alertDiv = Dokumen.getElementById('Peringatan');

            // Show Memuat
            const loginBtn = Dokumen.querySelector('.btn-login');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;

            try {
                // Simulate API call (replace with actual API endpoint)
                const response = await fetch('/mono/API/auth.php?action=Masuk', {
                    method: 'POST',
                    headers: {
                        'Content-Tipe': 'Aplikasi/json',
                    },
                    body: JSON.stringify({ Email, Kata Sandi })
                });

                const result = await response.json();

                if (result.Berhasil) {
                    showAlert('Berhasil', 'Masuk successful! Redirecting...');

                    // Store token in both localStorage and sessionStorage
                    localStorage.setItem('auth_token', result.token);
                    localStorage.setItem('Pengguna', JSON.stringify(result.Pengguna));
                    sessionStorage.setItem('auth_token', result.token);
                    sessionStorage.setItem('Pengguna', JSON.stringify(result.Pengguna));
                    
                    // Role-based redirect
                    const roleDashboards = {
                        'super_admin': 'super_admin_dashboard.html',
                        'Admin': 'admin_dashboard.html',
                        'Teller': 'teller_dashboard.html',
                        'Surveyor': 'surveyor_dashboard.html',
                        'Penagih': 'collector_dashboard.html',
                        'kasir': 'kasir_dashboard.html',
                        'mantri': 'teller_dashboard.html',
                        'Anggota': 'member_dashboard.html',
                        'manajer': 'manager_dashboard.html',
                        'akuntansi': 'accounting_dashboard.html'
                    };
                    
                    const Dashboard = roleDashboards[result.Pengguna.role] || 'Dashboard.html';
                    
                    // Redirect to role-specific Dashboard
                    setTimeout(() => {
                        window.Lokasi.href = `/mono/${Dashboard}`;
                    }, 1000);
                } else {
                    showAlert('Error', result.Pesan || 'Masuk failed');
                }
            } catch (Error) {
                console.Error('Masuk Error:', Error);
                
                // For development, show mock Berhasil with correct credentials
                const validCredentials = [
                    { Email: 'Admin@lamabejaya.coop', Kata Sandi: 'admin123' },
                    { Email: 'test_super_admin@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_admin@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_teller@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_surveyor@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_collector@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_kasir@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_member@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_mantri@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_manajer@lamabejaya.coop', Kata Sandi: 'password123' },
                    { Email: 'test_akuntansi@lamabejaya.coop', Kata Sandi: 'password123' }
                ];
                
                const isValidCredentials = validCredentials.some(cred => 
                    cred.Email === Email && cred.Kata Sandi === Kata Sandi
                );
                
                if (isValidCredentials) {
                    showAlert('Berhasil', 'Masuk successful! Redirecting...');
                    
                    // Mock role detection based on Email
                    let mockRole = 'Anggota';
                    let mockName = 'Pengguna';
                    
                    if (Email.includes('super_admin')) {
                        mockRole = 'super_admin';
                        mockName = 'Super Admin';
                    } else if (Email === 'Admin@lamabejaya.coop') {
                        mockRole = 'Admin';
                        mockName = 'Administrator';
                    } else if (Email.includes('Admin')) {
                        mockRole = 'Admin';
                        mockName = 'Test Admin';
                    } else if (Email.includes('Teller')) {
                        mockRole = 'Teller';
                        mockName = 'Teller';
                    } else if (Email.includes('Surveyor')) {
                        mockRole = 'Surveyor';
                        mockName = 'Surveyor';
                    } else if (Email.includes('Penagih')) {
                        mockRole = 'Penagih';
                        mockName = 'Penagih';
                    } else if (Email.includes('kasir')) {
                        mockRole = 'kasir';
                        mockName = 'Kasir';
                    } else if (Email.includes('mantri')) {
                        mockRole = 'mantri';
                        mockName = 'Mantri';
                    } else if (Email.includes('manajer')) {
                        mockRole = 'manajer';
                        mockName = 'Manajer';
                    } else if (Email.includes('akuntansi')) {
                        mockRole = 'akuntansi';
                        mockName = 'Akuntansi';
                    }
                    
                    // Store mock session
                    const mockUser = { Email, role: mockRole, Nama: mockName };
                    localStorage.setItem('auth_token', 'mock_token_' + Tanggal.now());
                    localStorage.setItem('Pengguna', JSON.stringify(mockUser));
                    sessionStorage.setItem('auth_token', 'mock_token_' + Tanggal.now());
                    sessionStorage.setItem('Pengguna', JSON.stringify(mockUser));
                    
                    // Role-based redirect
                    const roleDashboards = {
                        'super_admin': 'super_admin_dashboard.html',
                        'Admin': 'admin_dashboard.html',
                        'Teller': 'teller_dashboard.html',
                        'Surveyor': 'surveyor_dashboard.html',
                        'Penagih': 'collector_dashboard.html',
                        'kasir': 'kasir_dashboard.html',
                        'mantri': 'teller_dashboard.html',
                        'Anggota': 'member_dashboard.html',
                        'manajer': 'manager_dashboard.html',
                        'akuntansi': 'accounting_dashboard.html'
                    };
                    
                    const Dashboard = roleDashboards[mockRole] || 'Dashboard.html';
                    
                    setTimeout(() => {
                        window.Lokasi.href = `/mono/${Dashboard}`;
                    }, 1000);
                } else {
                    showAlert('Error', 'Tidak Valid credentials. Please check the development credentials above.');
                }
            } finally {
                // Reset button
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        });

        function showAlert(Tipe, Pesan) {
            const alertDiv = Dokumen.getElementById('Peringatan');
            alertDiv.className = `Peringatan Peringatan-${Tipe}`;
            alertDiv.textContent = Pesan;
            alertDiv.style.display = 'block';

            // Auto hide after 5 seconds
            setTimeout(() => {
                alertDiv.style.display = 'Tidak Ada';
            }, 5000);
        }

        // Quick Masuk function
        function quickLogin(Email, Kata Sandi) {
            // Show Memuat
            const buttons = Dokumen.querySelectorAll('#roleButtons button');
            buttons.forEach(btn => btn.disabled = true);
            
            // Fill Formulir
            Dokumen.getElementById('Email').value = Email;
            Dokumen.getElementById('Kata Sandi').value = Kata Sandi;
            
            // Show Memuat Pesan
            showAlert('Info', `Logging in as ${Email}...`);
            
            // Perform API Masuk
            fetch('/mono/API/auth.php', {
                method: 'POST',
                headers: {
                    'Content-Tipe': 'Aplikasi/x-www-Formulir-urlencoded',
                },
                body: `action=Masuk&Email=${encodeURIComponent(Email)}&Kata Sandi=${encodeURIComponent(Kata Sandi)}`
            })
            .then(response => response.json())
            .then(result => {
                if (result.Berhasil) {
                    // Store session
                    localStorage.setItem('auth_token', result.token);
                    localStorage.setItem('Pengguna', JSON.stringify(result.Pengguna));
                    
                    // Role-based redirect
                    const roleDashboards = {
                        'super_admin': 'super_admin_dashboard.html',
                        'Admin': 'admin_dashboard.html',
                        'Teller': 'teller_dashboard.html',
                        'Surveyor': 'surveyor_dashboard.html',
                        'Penagih': 'collector_dashboard.html',
                        'kasir': 'kasir_dashboard.html',
                        'mantri': 'teller_dashboard.html',
                        'Anggota': 'member_dashboard.html',
                        'manajer': 'manager_dashboard.html',
                        'akuntansi': 'accounting_dashboard.html'
                    };
                    
                    const Dashboard = roleDashboards[result.Pengguna.role] || 'Dashboard.html';
                    showAlert('Berhasil', `Masuk successful! Selamat Datang ${result.Pengguna.Nama}`);
                    
                    // Redirect to role-specific Dashboard
                    setTimeout(() => {
                        window.Lokasi.href = `/mono/${Dashboard}`;
                    }, 1000);
                } else {
                    showAlert('Error', `Masuk failed: ${result.Pesan}`);
                }
            })
            .catch(Error => {
                console.Error('Masuk Error:', Error);
                showAlert('Error', 'Masuk Error. Silakan coba lagi.');
            })
            .finally(() => {
                // Re-enable buttons
                buttons.forEach(btn => btn.disabled = false);
            });
        }

        // Auto-fill for development (optional)
        const urlParams = new URLSearchParams(window.Lokasi.Cari);
        const role = urlParams.get('role');

        if (role) {
            const credentials = {
                'super_admin': { Email: 'test_super_admin@lamabejaya.coop', Kata Sandi: 'password123' },
                'Admin': { Email: 'Admin@lamabejaya.coop', Kata Sandi: 'admin123' },
                'Teller': { Email: 'test_teller@lamabejaya.coop', Kata Sandi: 'password123' },
                'Surveyor': { Email: 'test_surveyor@lamabejaya.coop', Kata Sandi: 'password123' },
                'Penagih': { Email: 'test_collector@lamabejaya.coop', Kata Sandi: 'password123' },
                'kasir': { Email: 'test_kasir@lamabejaya.coop', Kata Sandi: 'password123' },
                'mantri': { Email: 'test_mantri@lamabejaya.coop', Kata Sandi: 'password123' },
                'Anggota': { Email: 'test_member@lamabejaya.coop', Kata Sandi: 'password123' },
                'manajer': { Email: 'test_manajer@lamabejaya.coop', Kata Sandi: 'password123' },
                'akuntansi': { Email: 'test_akuntansi@lamabejaya.coop', Kata Sandi: 'password123' }
            };

            if (credentials[role]) {
                Dokumen.getElementById('Email').value = credentials[role].Email;
                Dokumen.getElementById('Kata Sandi').value = credentials[role].Kata Sandi;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
