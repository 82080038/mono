<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anggota - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/mono/helpers/modal-styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
        }

        .btn-link {
            color: white;
            text-decoration: Tidak Ada;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn-link:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .container {
            padding: 2rem;
        }

        .Tabel-actions {
            white-space: nowrap;
        }

        .Tabel-actions .btn {
            margin: 0 2px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>👥 Manajemen Anggota</h1>
        <div class="d-flex align-items-center gap-3">
            <span id="Nama Pengguna">Memuat...</span>
            <a href="/members_crud.html" class="btn-link">← CRUD Anggota</a>
            <button class="btn-link" onclick="Keluar()">Keluar</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Daftar Anggota</h5>
                <button class="btn btn-primary" data-action="Tambah-Anggota">
                    <i class="fas fa-plus"></i> Tambah Anggota Baru
                </button>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Cari anggota..." id="searchInput">
                    </div>
                    <div class="col-md-6">
                        <select class="form-Pilih" id="statusFilter">
                            <option value="">Semua Status</option>
                            <option value="Aktif">Aktif</option>
                            <option value="Tidak Aktif">Tidak Aktif</option>
                        </select>
                    </div>
                </div>

                <div class="Tabel-responsive">
                    <table class="Tabel Tabel-hover">
                        <thead>
                            <tr>
                                <th>Nomor Anggota</th>
                                <th>Nama</th>
                                <th>NIK</th>
                                <th>Telepon</th>
                                <th>Status</th>
                                <th>Skor Kredit</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="membersTable">
                            <tr>
                                <td>M001</td>
                                <td>Budi Santoso</td>
                                <td>1234567890123456</td>
                                <td>08123456789</td>
                                <td><span class="badge badge-Berhasil">Aktif</span></td>
                                <td>75.50</td>
                                <td class="Tabel-actions">
                                    <button class="btn btn-sm btn-info" data-action="view-Anggota" data-id="1">
                                        <i class="fas fa-eye"></i> Lihat
                                    </button>
                                    <button class="btn btn-sm btn-alert" data-action="Edit-Anggota" data-id="1">
                                        <i class="fas fa-Edit"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteMember(1)">
                                        <i class="fas fa-trash"></i> Hapus
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/Semua.min.css">
    <!-- Indonesian Format Helper -->
    <script src="/mono/helpers/indonesian-format.js"></script>
    <script src="/mono/helpers/modal-Sistem.js"></script>

    <script>
        // Check authentication
        function checkAuth() {
            
            const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
            const Pengguna = localStorage.getItem('Pengguna') || sessionStorage.getItem('Pengguna');
            
            
            

            if (!token || !Pengguna) {
                
                window.Lokasi.href = '/mono/Masuk.html';
                return;
            }

            const userData = JSON.parse(Pengguna);
            Dokumen.getElementById('Nama Pengguna').textContent = userData.Nama || 'Pengguna';
            
        }

        function Keluar() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('Pengguna');
            sessionStorage.removeItem('auth_token');
            sessionStorage.removeItem('Pengguna');
            window.Lokasi.href = '/mono/Masuk.html';
        }

        function deleteMember(memberId) {
            if (Konfirmasi('Apakah Anda yakin ingin menghapus anggota ini?')) {
                $.ajax({
                    url: `/mono/API/Anggota/${memberId}`,
                    method: 'Hapus',
                    Berhasil: (response) => {
                        if (response.Berhasil) {
                            showAlert('Berhasil', 'Anggota berhasil dihapus');
                            Lokasi.reload();
                        } else {
                            showAlert('Error', response.Pesan);
                        }
                    },
                    Error: () => {
                        showAlert('Error', 'Terjadi kesalahan saat menghapus anggota');
                    }
                });
            }
        }

        // Cari functionality
        $('#searchInput').on('keyup', function () {
            const value = $(this).val().toLowerCase();
            $('#membersTable tr').Filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        // Status Filter
        $('#statusFilter').on('change', function () {
            const Status = $(this).val();
            if (Status === '') {
                $('#membersTable tr').show();
            } else {
                $('#membersTable tr').Filter(function () {
                    const rowStatus = $(this).find('.badge').text().toLowerCase();
                    $(this).toggle(rowStatus.includes(Status));
                });
            }
        });

        // Initialize
        checkAuth();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
