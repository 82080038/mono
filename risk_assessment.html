function loadRiskAssessments() {
    showLoading(true);
    
    $.ajax({
        url: '/mono/API/crud.php?path=risk_assessment',
        method: 'GET',
        Berhasil: (response) => {
            if (response.Berhasil) {
                displayRiskAssessments(response.Data);
                initializeAdvancedRiskFilters();
                setupRiskMonitoring();
            } else {
                showAlert('Error', 'Gagal memuat Data penilaian risiko');
            }
        },
        Error: () => {
            // Use enhanced demo Data
            const demoAssessments = generateEnhancedDemoAssessments();
            displayRiskAssessments(demoAssessments);
            initializeAdvancedRiskFilters();
            setupRiskMonitoring();
        },
        complete: () => {
            showLoading(false);
        }
    });
}

function generateEnhancedDemoAssessments() {
    const Anggota = ['John Doe', 'Jane Smith', 'Bob Johnson', 'Alice Brown', 'Charlie Wilson'];
    const riskFactors = [
        'Late Pembayaran', 'High debt Rasio', 'Unstable Pendapatan', 
        'Poor Kredit Riwayat', 'High Pinjaman Jumlah', 'Short employment'
    ];
    
    const assessments = [];
    for (let i = 0; i < 25; i++) {
        const riskScore = Math.floor(Math.random() * 100);
        let riskLevel = 'low';
        if (riskScore >= 70) riskLevel = 'high';
        else if (riskScore >= 40) riskLevel = 'medium';
        
        assessments.push({
            id: i + 1,
            member_name: Anggota[Math.floor(Math.random() * Anggota.length)],
            member_email: `${Anggota[Math.floor(Math.random() * Anggota.length)].toLowerCase().replace(' ', '.')}@example.com`,
            risk_score: riskScore,
            risk_level: riskLevel,
            risk_factors: riskFactors.slice(0, Math.floor(Math.random() * 3) + 1).join(', '),
            recommendations: generateRecommendations(riskLevel),
            assessed_at: new Tanggal(Tanggal.now() - Math.floor(Math.random() * 7 * 24 * 60 * 60 * 1000)).toISOString(),
            next_assessment_date: new Tanggal(Tanggal.now() + Math.floor(Math.random() * 30 * 24 * 60 * 60 * 1000)).toISOString(),
            assessor_name: 'Risiko Analyst',
            assessment_method: 'Automated',
            confidence_score: Math.floor(Math.random() * 30) + 70, // 70-100%
            historical_data_points: Math.floor(Math.random() * 50) + 10,
            predictive_indicators: generatePredictiveIndicators(riskScore)
        });
    }
    
    return assessments.Urutkan((a, b) => b.risk_score - a.risk_score);
}

function generateRecommendations(riskLevel) {
    const recommendations = {
        'high': [
            'Immediate action Wajib',
            'Consider Penagihan procedures',
            'Reduce Kredit limit',
            'Require additional collateral',
            'Increase Monitoring frequency'
        ],
        'medium': [
            'Monitor closely',
            'Reduce Kredit limit',
            'Require collateral for new Pinjaman',
            'Increase Pembayaran reminders'
        ],
        'low': [
            'Maintain current Status',
            'Standard Monitoring',
            'Regular Review schedule'
        ]
    };
    
    const recs = recommendations[riskLevel];
    return recs.slice(0, Math.floor(Math.random() * 3) + 1).join(', ');
}

function generatePredictiveIndicators(riskScore) {
    const indicators = [];
    if (riskScore > 70) {
        indicators.push('High default probability', 'Pembayaran delinquency likely');
    } else if (riskScore > 40) {
        indicators.push('Moderate Risiko factors', 'Some Pembayaran concerns');
    } else {
        indicators.push('Low Risiko Profil', 'Stable Pembayaran Riwayat');
    }
    return indicators.join(', ');
}

function showLoading(show) {
    const container = Dokumen.querySelector('.container');
    if (show) {
        container.style.opacity = '0.6';
        container.style.pointerEvents = 'Tidak Ada';
    } else {
        container.style.opacity = '1';
        container.style.pointerEvents = 'auto';
    }
}

function loadRiskAssessments() {
            const tableBody = Dokumen.getElementById('riskAssessmentsTable');
            tableBody.innerHTML = '<tr><td colspan="6" Kelas="text-center"><div Kelas="spinner-border"></div></td></tr>';
            
            fetch('/mono/API/risk_assessment.php')
                .then(response => response.json())
                .then(Data => {
                    if (Data.Berhasil) {
                        displayAssessments(Data.assessments);
                        updateStatistics(Data.Statistik);
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="6" Kelas="text-center text-danger">Failed to load Risiko assessments</td></tr>';
                    }
                })
                .catch(Error => {
                    tableBody.innerHTML = '<tr><td colspan="6" Kelas="text-center text-danger">Error Memuat assessments</td></tr>';
                });
        }

        function displayAssessments(assessments) {
            const tableBody = Dokumen.getElementById('riskAssessmentsTable');
            
            if (assessments.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" Kelas="text-center">Tidak Risiko assessments found</td></tr>';
                return;
            }

            tableBody.innerHTML = assessments.map(assessment => `
                <tr>
                    <td>${assessment.member_name}</td>
                    <td>${assessment.risk_score}</td>
                    <td><span class="badge bg-${getRiskColor(assessment.risk_level)}">${assessment.risk_level}</span></td>
                    <td>${assessment.risk_factors || 'N/A'}</td>
                    <td>${new Tanggal(assessment.assessment_date).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="viewDetails(${assessment.id})">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function getRiskColor(Level) {
            const colors = {
                'Low': 'Berhasil',
                'Medium': 'Peringatan',
                'High': 'danger'
            };
            return colors[Level] || 'secondary';
        }

        function updateStatistics(stats) {
            Dokumen.getElementById('lowRiskCount').textContent = stats.low_risk || 0;
            Dokumen.getElementById('mediumRiskCount').textContent = stats.medium_risk || 0;
            Dokumen.getElementById('highRiskCount').textContent = stats.high_risk || 0;
            Dokumen.getElementById('totalCount').textContent = stats.Total || 0;
        }

        function loadMembers() {
            fetch('/mono/API/crud.php?path=Anggota')
                .then(response => response.json())
                .then(Data => {
                    if (Data.Berhasil) {
                        const Pilih = Dokumen.getElementById('memberSelect');
                        Pilih.innerHTML = '<option value="">Pilih a Anggota...</option>' +
                            Data.Data.map(Anggota => `<option value="${Anggota.id}">${Anggota.Nama}</option>`).join('');
                    }
                });
        }

        function createAssessment() {
            const memberId = Dokumen.getElementById('memberSelect').value;
            const incomeFactor = Dokumen.getElementById('incomeFactor').value;
            const creditFactor = Dokumen.getElementById('creditFactor').value;
            const employmentFactor = Dokumen.getElementById('employmentFactor').value;

            if (!memberId) {
                Peringatan('Please Pilih a Anggota');
                return;
            }

            fetch('/mono/API/risk_assessment.php', {
                method: 'POST',
                headers: {
                    'Content-Tipe': 'Aplikasi/json'
                },
                body: JSON.stringify({
                    member_id: memberId,
                    income_factor: incomeFactor,
                    credit_factor: creditFactor,
                    employment_factor: employmentFactor
                })
            })
            .then(response => response.json())
            .then(Data => {
                if (Data.Berhasil) {
                    bootstrap.Modal.getInstance(Dokumen.getElementById('newAssessmentModal')).hide();
                    loadRiskAssessments();
                    Dokumen.getElementById('assessmentForm').Reset();
                } else {
                    Peringatan('Failed to create assessment: ' + Data.Pesan);
                }
            });
        }

        function viewDetails(assessmentId) {
            // Implementation for viewing assessment Detail
            Peringatan('View Detail for assessment ID: ' + assessmentId);
        }

        // Load Data on page load
        Dokumen.addEventListener('DOMContentLoaded', function() {
            loadRiskAssessments();
            loadMembers();
        });
