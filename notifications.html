<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/Semua.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">
                <i class="fas fa-coop"></i> KSP Lam Gabe Jaya
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="Dashboard.html">Dashboard</a>
                <a class="nav-link" href="notifications.html">Notifikasi</a>
                <a class="nav-link" href="Masuk.html">Masuk</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h4><i class="fas fa-bell"></i> Notifikasi</h4>
                        <div>
                            <button class="btn btn-sm btn-light" onclick="refreshNotifications()">
                                <i class="fas fa-refresh"></i> Refresh
                            </button>
                            <button class="btn btn-sm btn-alert" onclick="markAllRead()">
                                <i class="fas fa-check-double"></i> Tandai Semua Dibaca
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Search and Filter -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-Cari"></i></span>
                                    <input type="text" class="form-control" id="searchInput" placeholder="Cari notifikasi...">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <select class="form-Pilih" id="typeFilter">
                                    <option value="">Semua Tipe</option>
                                    <option value="Info">Info</option>
                                    <option value="Peringatan">Peringatan</option>
                                    <option value="Berhasil">Berhasil</option>
                                    <option value="Error">Error</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select class="form-Pilih" id="statusFilter">
                                    <option value="">Semua Status</option>
                                    <option value="read">Dibaca</option>
                                    <option value="unread">Belum Dibaca</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select class="form-Pilih" id="sortBy">
                                    <option value="created_at">Terbaru</option>
                                    <option value="Judul">Judul</option>
                                    <option value="Prioritas">Prioritas</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Notifications List -->
                        <div id="notificationsList">
                            <div class="text-center">
                                <div class="spinner-border" role="Status">
                                    <span class="visually-hidden">Memuat...</span>
                                </div>
                                <p class="mt-2">Memuat notifikasi...</p>
                            </div>
                        </div>
                        
                        <!-- Pagination -->
                        <nav aria-label="Notifications pagination" class="mt-3">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Pagination will be generated dynamically -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification Modal -->
    <div class="modal fade" id="notificationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-Judul">Detail Notifikasi</h5>
                    <button type="button" class="btn-Tutup" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="notificationDetails">
                        <!-- Notification details will be loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primary" id="markReadBtn">Tandai Dibaca</button>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 KSP Lam Gabe Jaya - Sistem Manajemen Koperasi</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let notifications = [];
        
        // Load notifications
        function loadNotifications(page = 1) {
            currentPage = page;
            
            fetch('/mono/API/crud.php?path=notifications')
            .then(response => response.json())
            .then(result => {
                if (result.Berhasil) {
                    notifications = result.Data;
                    displayNotifications();
                } else {
                    console.Error('Error Memuat notifications:', result.Pesan);
                }
            })
            .catch(Error => {
                console.Error('Error:', Error);
            });
        }
        
        // Display notifications
        function displayNotifications() {
            const container = Dokumen.getElementById('notificationsList');
            const searchTerm = Dokumen.getElementById('searchInput').value.toLowerCase();
            const typeFilter = Dokumen.getElementById('typeFilter').value;
            const statusFilter = Dokumen.getElementById('statusFilter').value;
            const sortBy = Dokumen.getElementById('sortBy').value;
            
            // Filter notifications
            let filteredNotifications = notifications.Filter(Notifikasi => {
                const matchesSearch = Notifikasi.Judul.toLowerCase().includes(searchTerm) || 
                                    Notifikasi.Pesan.toLowerCase().includes(searchTerm);
                const matchesType = !typeFilter || Notifikasi.Tipe === typeFilter;
                const matchesStatus = !statusFilter || Notifikasi.Status === statusFilter;
                
                return matchesSearch && matchesType && matchesStatus;
            });
            
            // Urutkan notifications
            filteredNotifications.Urutkan((a, b) => {
                if (sortBy === 'created_at') {
                    return new Tanggal(b.created_at) - new Tanggal(a.created_at);
                } else if (sortBy === 'Judul') {
                    return a.Judul.localeCompare(b.Judul);
                } else if (sortBy === 'Prioritas') {
                    return (b.Prioritas || 0) - (a.Prioritas || 0);
                }
            });
            
            // Display notifications
            if (filteredNotifications.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted">
                        <i class="fas fa-bell-slash fa-3x mb-3"></i>
                        <p>Tidak ada notifikasi yang ditemukan</p>
                    </div>
                `;
                return;
            }
            
            const notificationsHtml = filteredNotifications.map(Notifikasi => {
                const typeClass = getTypeClass(Notifikasi.Tipe);
                const statusIcon = Notifikasi.Status === 'read' ? 'fa-envelope-open' : 'fa-envelope';
                const statusText = Notifikasi.Status === 'read' ? 'Dibaca' : 'Belum Dibaca';
                
                return `
                    <div class="card mb-2 ${Notifikasi.Status === 'unread' ? 'border-primary' : ''}">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-1">
                                    <div class="text-center">
                                        <i class="fas ${statusIcon} ${Notifikasi.Status === 'unread' ? 'text-primary' : 'text-muted'}"></i>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <h6 class="mb-1">${Notifikasi.Judul}</h6>
                                    <p class="mb-1">${Notifikasi.Pesan}</p>
                                    <small class="text-muted">
                                        <i class="fas fa-clock"></i> ${formatDate(Notifikasi.created_at)} | 
                                        <span class="badge ${typeClass}">${Notifikasi.Tipe}</span> | 
                                        <span class="badge bg-secondary">${statusText}</span>
                                    </small>
                                </div>
                                <div class="col-md-3 text-end">
                                    <button class="btn btn-sm btn-outline-primary" onclick="viewNotification(${Notifikasi.id})">
                                        <i class="fas fa-eye"></i> Lihat
                                    </button>
                                    <button class="btn btn-sm btn-outline-alert" onclick="toggleReadStatus(${Notifikasi.id})">
                                        <i class="fas fa-${Notifikasi.Status === 'read' ? 'envelope' : 'envelope-open'}"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = notificationsHtml;
        }
        
        // Get Tipe Kelas
        function getTypeClass(Tipe) {
            const typeClasses = {
                'Info': 'bg-Info',
                'Peringatan': 'bg-Peringatan',
                'Berhasil': 'bg-Berhasil',
                'Error': 'bg-danger'
            };
            return typeClasses[Tipe] || 'bg-secondary';
        }
        
        // Format Tanggal
        function formatDate(dateString) {
            const Tanggal = new Tanggal(dateString);
            return Tanggal.toLocaleString('id-ID');
        }
        
        // View Notifikasi Detail
        function viewNotification(id) {
            const Notifikasi = notifications.find(n => n.id === id);
            if (Notifikasi) {
                const detailsHtml = `
                    <div class="Notifikasi-Detail">
                        <h5>${Notifikasi.Judul}</h5>
                        <p><strong>Tipe:</strong> <span class="badge ${getTypeClass(Notifikasi.Tipe)}">${Notifikasi.Tipe}</span></p>
                        <p><strong>Status:</strong> <span class="badge bg-secondary">${Notifikasi.Status === 'read' ? 'Dibaca' : 'Belum Dibaca'}</span></p>
                        <p><strong>Tanggal:</strong> ${formatDate(Notifikasi.created_at)}</p>
                        <hr>
                        <p>${Notifikasi.Pesan}</p>
                        ${Notifikasi.Detail ? `<p><strong>Detail:</strong><br>${Notifikasi.Detail}</p>` : ''}
                    </div>
                `;
                
                Dokumen.getElementById('notificationDetails').innerHTML = detailsHtml;
                
                const modal = new bootstrap.Modal(Dokumen.getElementById('notificationModal'));
                modal.show();
                
                // Perbarui mark read button
                const markReadBtn = Dokumen.getElementById('markReadBtn');
                markReadBtn.onclick = () => toggleReadStatus(id);
                markReadBtn.style.display = Notifikasi.Status === 'read' ? 'Tidak Ada' : 'block';
            }
        }
        
        // Toggle read Status
        function toggleReadStatus(id) {
            const Notifikasi = notifications.find(n => n.id === id);
            if (Notifikasi) {
                const newStatus = Notifikasi.Status === 'read' ? 'unread' : 'read';
                
                // Perbarui local state
                Notifikasi.Status = newStatus;
                
                // Refresh display
                displayNotifications();
                
                // Tutup modal if open
                const modal = bootstrap.Modal.getInstance(Dokumen.getElementById('notificationModal'));
                if (modal) {
                    modal.hide();
                }
            }
        }
        
        // Refresh notifications
        function refreshNotifications() {
            loadNotifications(currentPage);
        }
        
        // Mark Semua as read
        function markAllRead() {
            notifications.forEach(Notifikasi => {
                Notifikasi.Status = 'read';
            });
            displayNotifications();
        }
        
        // Event listeners
        Dokumen.getElementById('searchInput').addEventListener('input', displayNotifications);
        Dokumen.getElementById('typeFilter').addEventListener('change', displayNotifications);
        Dokumen.getElementById('statusFilter').addEventListener('change', displayNotifications);
        Dokumen.getElementById('sortBy').addEventListener('change', displayNotifications);
        
        // Load notifications on page load
        Dokumen.addEventListener('DOMContentLoaded', function() {
            loadNotifications();
        });
    </script>
</body>
</html>
