<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengguna - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/mono/helpers/modal-styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
        }
        
        .btn-link {
            color: white;
            text-decoration: Tidak Ada;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .btn-link:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .container {
            padding: 2rem;
        }
        
        .Tabel-actions {
            white-space: nowrap;
        }
        
        .Tabel-actions .btn {
            margin: 0 2px;
        }
        
        .role-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .role-super-Admin {
            background: #dc3545;
            color: white;
        }
        
        .role-Admin {
            background: #0d6efd;
            color: white;
        }
        
        .role-mantri {
            background: #198754;
            color: white;
        }
        
        .role-Anggota {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👤 Manajemen Pengguna</h1>
        <div class="d-flex align-items-center gap-3">
            <span id="Nama Pengguna">Memuat...</span>
            <a href="/mono/users_crud.html" class="btn-link">← CRUD Pengguna</a>
            <button class="btn-link" onclick="Keluar()">Keluar</button>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Daftar Pengguna</h5>
                <button class="btn btn-primary" data-action="Tambah-Pengguna">
                    <i class="fas fa-plus"></i> Tambah Pengguna
                </button>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Cari pengguna..." id="searchInput">
                    </div>
                    <div class="col-md-6">
                        <select class="form-Pilih" id="roleFilter">
                            <option value="">Semua Role</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="mantri">Mantri</option>
                            <option value="Anggota">Anggota</option>
                        </select>
                    </div>
                </div>
                
                <div class="Tabel-responsive">
                    <table class="Tabel Tabel-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nama</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Terakhir Masuk</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td>1</td>
                                <td>Administrator</td>
                                <td>Admin@lamgabejaya.coop</td>
                                <td><span class="role-badge role-super-Admin">Super Admin</span></td>
                                <td><span class="badge bg-Berhasil">Aktif</span></td>
                                <td>-</td>
                                <td class="Tabel-actions">
                                    <button class="btn btn-sm btn-info" data-action="view-Pengguna" data-id="1">
                                        <i class="fas fa-eye"></i> Lihat
                                    </button>
                                    <button class="btn btn-sm btn-alert" data-action="Edit-Pengguna" data-id="1">
                                        <i class="fas fa-Edit"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteUser(1)">
                                        <i class="fas fa-trash"></i> Hapus
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/Semua.min.css">
    <!-- Indonesian Format Helper -->
    <script src="/mono/helpers/indonesian-format.js"></script>
    <script src="/mono/helpers/modal-Sistem.js"></script>
    
    <script>
        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            const Pengguna = localStorage.getItem('Pengguna');
            
            if (!token || !Pengguna) {
                window.Lokasi.href = '/mono/Masuk.html';
                return;
            }
            
            const userData = JSON.parse(Pengguna);
            Dokumen.getElementById('Nama Pengguna').textContent = userData.Nama || 'Pengguna';
        }
        
        function Keluar() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('Pengguna');
            window.Lokasi.href = '/mono/Masuk.html';
        }
        
        function deleteUser(userId) {
            if (Konfirmasi('Apakah Anda yakin ingin menghapus pengguna ini?')) {
                showAlert('Info', 'Fitur hapus pengguna akan segera tersedia');
            }
        }
        
        // Cari functionality
        $('#searchInput').on('keyup', function() {
            const value = $(this).val().toLowerCase();
            $('#usersTable tr').Filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });
        
        // Role Filter
        $('#roleFilter').on('change', function() {
            const role = $(this).val();
            if (role === '') {
                $('#usersTable tr').show();
            } else {
                $('#usersTable tr').Filter(function() {
                    const rowRole = $(this).find('.role-badge').text().toLowerCase();
                    $(this).toggle(rowRole.includes(role.replace('_', ' ')));
                });
            }
        });
        
        // Load Pengguna from API
        function loadUsers() {
            $.ajax({
                url: '/mono/API/crud.php?path=Pengguna',
                method: 'GET',
                Berhasil: (response) => {
                    if (response.Berhasil) {
                        displayUsers(response.Data);
                    }
                },
                Error: () => {
                    
                }
            });
        }
        
        // Display Pengguna in Tabel
        function displayUsers(Pengguna) {
            const tableRows = Pengguna.map(Pengguna => `
                <tr>
                    <td>${Pengguna.id}</td>
                    <td>${Pengguna.Nama}</td>
                    <td>${Pengguna.Email}</td>
                    <td><span class="role-badge role-${Pengguna.role.replace('_', '-')}">${getRoleDisplay(Pengguna.role)}</span></td>
                    <td><span class="badge ${Pengguna.is_active ? 'bg-Berhasil' : 'bg-danger'}">${Pengguna.is_active ? 'Aktif' : 'Tidak Aktif'}</span></td>
                    <td>${Pengguna.last_login ? formatTanggal(Pengguna.last_login) : '-'}</td>
                    <td class="Tabel-actions">
                        <button class="btn btn-sm btn-info" data-action="view-Pengguna" data-id="${Pengguna.id}">
                            <i class="fas fa-eye"></i> Lihat
                        </button>
                        <button class="btn btn-sm btn-alert" data-action="Edit-Pengguna" data-id="${Pengguna.id}">
                            <i class="fas fa-Edit"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${Pengguna.id})">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </td>
                </tr>
            `).join('');
            
            $('#usersTable').html(tableRows);
        }
        
        // Get role display Nama
        function getRoleDisplay(role) {
            const roleNames = {
                'super_admin': 'Super Admin',
                'Admin': 'Admin',
                'mantri': 'Mantri',
                'Anggota': 'Anggota'
            };
            return roleNames[role] || role;
        }
        
        // Utility functions
        function showAlert(Tipe, Pesan) {
            const alertHtml = `
                <div class="alert alert-${Tipe} alert-dismissible fade show" role="Peringatan">
                    ${Pesan}
                    <button type="button" class="btn-Tutup" data-bs-dismiss="Peringatan"></button>
                </div>
            `;
            $('.container').prepend(alertHtml);
            
            setTimeout(() => {
                $('.Peringatan').fadeOut();
            }, 5000);
        }
        
        // Initialize
        checkAuth();
        loadUsers();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
