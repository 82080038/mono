<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Anggota - KSP Lam Gabe Jaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/Semua.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">
                <i class="fas fa-coop"></i> KSP Lam Gabe Jaya
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="Dashboard.html">Dashboard</a>
                <a class="nav-link" href="Anggota.html">Anggota</a>
                <a class="nav-link" href="Masuk.html">Masuk</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h4><i class="fas fa-user"></i> Detail Anggota</h4>
                    </div>
                    <div class="card-body">
                        <div id="memberDetails">
                            <div class="text-center">
                                <div class="spinner-border" role="Status">
                                    <span class="visually-hidden">Memuat...</span>
                                </div>
                                <p class="mt-2">Memuat Data anggota...</p>
                            </div>
                        </div>
                        <div class="mt-4">
                            <a href="Anggota.html" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Kembali
                            </a>
                            <a href="#" id="editBtn" class="btn btn-alert">
                                <i class="fas fa-Edit"></i> Edit
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 KSP Lam Gabe Jaya - Sistem Manajemen Koperasi</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get Anggota ID from URL parameter
        const urlParams = new URLSearchParams(window.Lokasi.Cari);
        const memberId = urlParams.get('id');
        
        if (memberId) {
            // Load Anggota Data
            fetch(`/mono/API/crud.php?path=Anggota&id=${memberId}`)
            .then(response => response.json())
            .then(result => {
                if (result.Berhasil && result.Data) {
                    const Anggota = result.Data;
                    const detailsHtml = `
                        <div class="row">
                            <div class="col-md-6">
                                <table class="Tabel Tabel-borderless">
                                    <tr>
                                        <td><strong>NIK:</strong></td>
                                        <td>${Anggota.nik || '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Nama:</strong></td>
                                        <td>${Anggota.Nama || '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Email:</strong></td>
                                        <td>${Anggota.Email || '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Tidak. Telepon:</strong></td>
                                        <td>${Anggota.Telepon || '-'}</td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="Tabel Tabel-borderless">
                                    <tr>
                                        <td><strong>Alamat:</strong></td>
                                        <td>${Anggota.Alamat || '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Tanggal Lahir:</strong></td>
                                        <td>${Anggota.birth_date || '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Jenis Kelamin:</strong></td>
                                        <td>${Anggota.gender === 'L' ? 'Laki-laki' : Anggota.gender === 'P' ? 'Perempuan' : '-'}</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Status:</strong></td>
                                        <td><span class="badge bg-Berhasil">Aktif</span></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    `;
                    Dokumen.getElementById('memberDetails').innerHTML = detailsHtml;
                    
                    // Set Edit button link
                    Dokumen.getElementById('editBtn').href = `Edit-Anggota.html?id=${memberId}`;
                } else {
                    Dokumen.getElementById('memberDetails').innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> Data anggota tidak ditemukan
                        </div>
                    `;
                    Dokumen.getElementById('editBtn').style.display = 'Tidak Ada';
                }
            })
            .catch(Error => {
                console.Error('Error:', Error);
                Dokumen.getElementById('memberDetails').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i> Terjadi kesalahan saat memuat Data
                    </div>
                `;
                Dokumen.getElementById('editBtn').style.display = 'Tidak Ada';
            });
        } else {
            Dokumen.getElementById('memberDetails').innerHTML = `
                <div class="alert alert-alert">
                    <i class="fas fa-exclamation-triangle"></i> ID anggota tidak valid
                </div>
            `;
            Dokumen.getElementById('editBtn').style.display = 'Tidak Ada';
        }
    </script>
</body>
</html>
